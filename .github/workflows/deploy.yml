name: Build the catalog and deploy

# The workflow runs for changes that can affect construction, runtime behaviour
# or deployment. Running CI does not necessarily mean rebuilding the semantic
# layer: model-backed construction runs only when one of its semantic inputs
# changed.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "prompts/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "fly.toml"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "data/**"
      - "prompts/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"

# The pipeline writes `semantic_layer.json` and may register a new
# `product_type` in `vocabularies.yaml`, so it needs to push to the branch.
# The default token is read-only in restricted repositories; this raises it for
# this job only, and to nothing else.
permissions:
  contents: write

# Two runs on the same branch would push over each other. They queue instead of
# cancelling: a half-finished run must not leave the artifact written and the
# vocabulary unwritten.
concurrency:
  group: build-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits are needed to know what changed in this commit.
          # `enrich.py` also compares the current vocabulary with the previous
          # one to distinguish inventory growth from a change of criterion, and
          # `validate_semantic.py` uses the previous revision for the growth
          # invariant.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # `anthropic` is installed only here, on the construction machine. It is
        # deliberately absent from requirements.txt: if it were there it would
        # travel inside the image, and the container would have something at hand
        # to call a model with (A3.7).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install anthropic

      - name: Classify the own fields when semantic construction is required
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            python scripts/enrich.py \
              --csv data/catalog.csv \
              --out data/semantic_layer.json
          elif git diff --quiet HEAD~1 HEAD -- \
            data/catalog.csv \
            data/vocabularies.yaml \
            prompts/enrich.md \
            prompts/relate.md
          then
            echo "Semantic inputs unchanged; classification is not rebuilt."
          else
            python scripts/enrich.py \
              --csv data/catalog.csv \
              --out data/semantic_layer.json
          fi

      - name: Recompute the relations when semantic construction is required
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            python scripts/relate.py \
              --csv data/catalog.csv \
              --semantic data/semantic_layer.json
          elif ! git diff --quiet HEAD~1 HEAD -- \
            data/catalog.csv \
            data/semantic_layer.json \
            prompts/relate.md
          then
            python scripts/relate.py \
              --csv data/catalog.csv \
              --semantic data/semantic_layer.json
          elif ! git diff --quiet -- data/semantic_layer.json
          then
            python scripts/relate.py \
              --csv data/catalog.csv \
              --semantic data/semantic_layer.json
          else
            echo "Relation inputs unchanged; relations are not rebuilt."
          fi

      - name: Coverage gate
        # The gate always runs. It validates the semantic artifact that the
        # runtime service would consume, whether that artifact was rebuilt in
        # this execution or was already committed.
        run: |
          python scripts/validate_semantic.py \
            --csv data/catalog.csv \
            --semantic data/semantic_layer.json

      - name: Tests
        # Tests always run. Code, API or infrastructure changes must prove that
        # the service still behaves correctly without forcing an unnecessary
        # model-backed reconstruction.
        run: python -m pytest tests -q

      - name: Commit the recomputed catalog
        # When semantic construction changed either file, both travel together.
        # When nothing changed, there is simply nothing to commit.
        #
        # A push made with GITHUB_TOKEN does not trigger this workflow again, so
        # this cannot create a reconstruction loop.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Recompute the semantic layer"
          file_pattern: data/semantic_layer.json data/vocabularies.yaml

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false