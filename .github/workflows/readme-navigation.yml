name: Format README navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-navigation.yml"

permissions:
  contents: write

jobs:
  format-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Add contents and normalize heading hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          if "\n## Contents\n" in text:
              raise SystemExit("README already contains a Contents section")

          toc = """## Contents

          ### Overview
          - [The problem](#the-problem)
          - [The solution](#the-solution)
          - [Architecture](#architecture)

          ### Catalog and discovery
          - [Data lifecycle](#data-lifecycle)
          - [Data model and semantic layer](#data-model-and-semantic-layer)
          - [Discovery and selection logic](#discovery-and-selection-logic)
          - [API capabilities](#api-capabilities)
          - [API contract and response design](#api-contract-and-response-design)

          ### Conversational system
          - [Agent orchestration in indigo.ai](#agent-orchestration-in-indigoai)

          ### Engineering and operations
          - [Project structure](#project-structure)
          - [Running locally](#running-locally)
          - [Configuration and security](#configuration-and-security)
          - [Testing and validation](#testing-and-validation)
          - [CI/CD and semantic pipeline](#cicd-and-semantic-pipeline)
          - [Deployment](#deployment)

          ### Engineering rationale
          - [Key design decisions](#key-design-decisions)
          - [Performance and scalability](#performance-and-scalability)
          - [Known limitations](#known-limitations)
          """.strip()

          marker = (
              "- Swagger UI: `https://indigo-catalog-service.fly.dev/docs`\n\n"
              "---\n\n"
              "## The problem"
          )
          replacement = (
              "- Swagger UI: `https://indigo-catalog-service.fly.dev/docs`\n\n"
              + toc
              + "\n\n---\n\n## The problem"
          )
          if marker not in text:
              raise SystemExit("Expected README insertion marker was not found")
          text = text.replace(marker, replacement, 1)

          main_sections = {
              "The problem",
              "The solution",
              "Architecture",
              "Data lifecycle",
              "Data model and semantic layer",
              "Discovery and selection logic",
              "API capabilities",
              "API contract and response design",
              "Agent orchestration in indigo.ai",
              "Project structure",
              "Running locally",
              "Configuration and security",
              "Testing and validation",
              "CI/CD and semantic pipeline",
              "Deployment",
              "Key design decisions",
              "Performance and scalability",
              "Known limitations",
              "Contents",
          }

          lines = text.splitlines(keepends=True)
          in_fence = False
          for index, line in enumerate(lines):
              body = line.rstrip("\r\n")
              ending = line[len(body):]
              stripped = body.lstrip()

              if stripped.startswith("```") or stripped.startswith("~~~"):
                  in_fence = not in_fence
                  continue
              if in_fence:
                  continue

              if body.startswith("# "):
                  heading = body[2:]
                  if heading != "Catalog Service · Product Discovery Agent":
                      lines[index] = "### " + heading + ending
              elif body.startswith("## "):
                  heading = body[3:]
                  if heading not in main_sections:
                      lines[index] = "### " + heading + ending

          result = "".join(lines)

          for heading in main_sections - {"Contents"}:
              if f"\n## {heading}\n" not in "\n" + result:
                  raise SystemExit(f"Main section lost or demoted unexpectedly: {heading}")

          path.write_text(result, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit README
        run: |
          rm .github/workflows/readme-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-navigation.yml
          git commit -m "Make README navigable"
          git push