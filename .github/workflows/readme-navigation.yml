name: Update README presentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-navigation.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Add live demo and remove internal planning docs from README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          demo = "- Live demo: `https://lsda3.github.io/catalog_service/`\n"
          anchor = "**Live service**\n\n"
          if demo not in text:
              if anchor not in text:
                  raise SystemExit("Live service anchor not found")
              text = text.replace(anchor, anchor + demo, 1)

          targets = [
              "├── bloque-A-datos.md\n",
              "├── plan-de-construccion.md\n",
              "| `bloque-A-datos.md` | Detailed design decisions and data-system specification |\n",
              "| `plan-de-construccion.md` | Construction plan and work-order history |\n",
          ]
          for target in targets:
              if target not in text:
                  raise SystemExit(f"Expected README line not found: {target!r}")
              text = text.replace(target, "", 1)

          if "bloque-A-datos.md" in text or "plan-de-construccion.md" in text:
              raise SystemExit("Internal planning-document references remain in README")
          if demo not in text:
              raise SystemExit("Live demo link was not added")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit README
        run: |
          rm .github/workflows/readme-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-navigation.yml
          git commit -m "Add live demo and clean README"
          git push
